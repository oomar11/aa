name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AA_SITE_PASSWORD: ci-dummy-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # ESLint عنده أخطاء قديمة (prefer-const / no-require-imports). خلّيناه معلوماتي
      # لحد ما يتنضّف، وبعدها شيل continue-on-error.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
      - name: Dependency audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
